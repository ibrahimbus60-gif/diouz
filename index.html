<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diouz</title>
<style>body{font-family:system-ui;display:grid;place-items:center;min-height:100vh;margin:0;background:#0f172a;color:#fff}.l{font-weight:800}</style>
</head><body><div class="l" id="s">Diouz…</div>
<script>
(async function(){
  const s=document.getElementById("s");
  const files=["c0a", "c0b", "c1a", "c1b", "c2a", "c2b", "c3a", "c3b", "b4"];
  try{
    for(const f of files){
      await new Promise((res,rej)=>{
        const sc=document.createElement("script");
        sc.src=f+".js";
        sc.onload=res;sc.onerror=rej;
        document.head.appendChild(sc);
      });
    }
    const B64=window.__B.join("");
    const bin=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream("gzip");
    const stream=new Blob([bin]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    s.textContent="Erreur de chargement";
    console.error(e);
  }
})();
</script></body></html>
